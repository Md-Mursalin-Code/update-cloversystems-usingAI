<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet | Clover Systems</title>
<meta name="description" content="The Clover Systems drone fleet: SHYENA-S16, BAJRA-I and CHOKH-C5.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="js/drone-viewer.js"></script>
</head>
<body class="antialiased">
<div id="site-header"></div>

<section class="relative pt-40 pb-16 grid-bg overflow-hidden">
  <canvas id="particles" class="absolute inset-0 w-full h-full"></canvas>
  <div class="absolute inset-0 bg-gradient-to-b from-transparent to-ink"></div>
  <div class="relative max-w-4xl mx-auto px-5 text-center">
    <p class="text-clover-400 uppercase tracking-[.3em] text-xs mb-3">Our fleet</p>
    <h1 class="font-display text-5xl md:text-7xl font-bold text-white">Three platforms. One mission.</h1>
    <p class="text-gray-400 mt-6 text-lg">Drag any drone to rotate it 360°, or open its page for the full profile.</p>
  </div>
</section>

<div id="fleet-list"></div>

<section class="max-w-7xl mx-auto px-5 pt-20">
  <div class="text-center mb-10 reveal"><p class="text-clover-400 uppercase tracking-[.3em] text-xs mb-3">Side by side</p><h2 class="font-display text-4xl md:text-5xl font-bold text-white">Compare the fleet</h2></div>
  <div class="reveal overflow-x-auto glass rounded-xl">
    <table class="w-full text-left text-sm min-w-[640px]">
      <thead class="text-clover-400 uppercase text-xs tracking-widest">
        <tr class="border-b border-clover-500/20"><th class="p-4">Platform</th><th class="p-4">Role</th><th class="p-4">Weight</th><th class="p-4">Payload</th><th class="p-4">Endurance</th><th class="p-4">Range</th></tr>
      </thead>
      <tbody id="compare-body" class="divide-y divide-white/5"></tbody>
    </table>
  </div>
</section>

<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="js/drones-data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
